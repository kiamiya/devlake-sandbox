# Généré par AgentLake : relancer le bootstrap plutôt que modifier ce fichier.
name: AgentLake — agent
# Le dispatcher relie un run à son issue par ce titre (détection des jobs morts).
run-name: 'AgentLake — agent, issue #${{ inputs.issue_number }}, tentative ${{ inputs.attempt }}'

on:
  # Déclenché par le dispatcher ; workflow_dispatch exige le droit d'écriture.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Numéro de l'issue de la tâche
        type: number
        required: true
      profile:
        description: Profil d'agent (.agentlake/profiles/<profil>.yml)
        type: string
        required: true
      attempt:
        description: Numéro de tentative
        type: number
        default: 1
      resume_reason:
        description: Raison du lancement
        type: choice
        options: [none, answer, ci-failure]
        default: none
      needs_editor:
        description: La tâche passe par l'éditeur (une seule tâche d'éditeur à la fois par projet)
        type: boolean
        default: false

permissions: {}

# Pas de groupe de concurrence ici : le job appelé a déjà `agentlake-task-<issue>` ou
# `agentlake-editor-<dépôt>` (le même groupe à deux niveaux bloquerait le job indéfiniment).

jobs:
  agent:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      # Jeton de l'app GitHub Claude : la PR de l'agent déclenche la CI.
      id-token: write
    uses: kiamiya/devlake/.github/workflows/agent-task.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
      profile: ${{ inputs.profile }}
      attempt: ${{ inputs.attempt }}
      resume_reason: ${{ inputs.resume_reason }}
      needs_editor: ${{ inputs.needs_editor }}
      devlake_ref: v1
    secrets: inherit
